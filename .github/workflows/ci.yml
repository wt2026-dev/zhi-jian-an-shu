name: Industrial Ops CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-test:
    name: Build & Test Integration Pipeline
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_placeholder_jwt_secret_key_123456789' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_placeholder_gemini_api_key' }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY || 'ci_placeholder_dashscope_api_key' }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run TypeScript Type Check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run Automated Test Suite (npm test)
        run: npm test

      - name: Build Production Bundle (npm run build)
        run: npm run build
