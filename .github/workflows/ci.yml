name: Industrial Ops CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-test:
    name: Build & Test Integration Pipeline
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      # 密钥安全：不写死任何占位密钥。优先读取仓库 secrets；
      # 未配置时用 openssl 每次运行随机生成的一次性值，杜绝固定字符串入库。
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Generate One-off Secrets (fallback when repository secrets absent)
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
            echo "::notice::JWT_SECRET 未配置 secrets，已生成一次性随机值"
          fi
          # DASHSCOPE_API_KEY 允许缺省：测试套件对未配置密钥走规则引擎降级路径

      - name: Install Dependencies
        # fail fast：锁文件不一致直接失败，暴露依赖漂移（禁止 || npm install 兜底掩盖问题）
        run: npm ci

      - name: Run Static Checks (ESLint + tsc --noEmit)
        # 分级：硬线规则（0 存量违规）为 error 会拦截新增债；历史债为 warn，
        # 只标注不置红（未加 --max-warnings，避免并行会话的正常改动把 CI 打停）。
        run: npm run lint

      - name: Run Automated Test Suite (npm test)
        run: npm test

      - name: Build Production Bundle (npm run build)
        run: npm run build
