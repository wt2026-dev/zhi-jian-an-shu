# ============================================================
# 智检安枢——数字孪生驱动的工业装备检修与安全管控一体化平台 - Docker Compose 编排（Node.js 主服务）
#
# 说明：
#   1. 本项目主服务为根目录 Node.js server.ts（Express + React + PGlite）。
#   2. 默认（`docker compose up -d`）使用嵌入式持久化 PostgreSQL（PGlite），
#      数据保存在命名卷 appdata，重启不丢失；app 不依赖任何数据库容器。
#   3. 如需接入独立 PostgreSQL（DB_TYPE=postgres）：
#        docker compose --profile postgres up -d
#      并在 .env 中配置 DB_USER / DB_PASSWORD / DB_NAME（无默认弱口令，
#      未配置 DB_PASSWORD 时 postgres 服务将拒绝启动并提示）。
#      注意：postgres 服务位于 postgres profile 下，默认配置不会创建或映射 5432 端口。
#   4. 必填环境变量 JWT_SECRET 请在 .env 中配置（应用已做 fail-fast，缺失将拒绝启动）。
# ============================================================

name: industrial-maintenance

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial-maintenance-app
    restart: unless-stopped
    # 本地低负载演示场景资源限制：CPU≤70%、内存≤4G、禁swap防OOM
    cpus: "0.7"
    mem_limit: 4g
    memswap_limit: 4g
    cpu_shares: 1024
    ports:
      - "3000:3000"
    env_file:
      - .env
    # 依赖说明：默认 pglite 模式无需任何数据库容器，故不依赖 postgres 服务；
    # postgres 模式请使用 `docker compose --profile postgres up -d`，
    # 应用对 PostgreSQL 连接失败有平滑降级与重试逻辑（见 src/db/db.ts）。
    environment:
      NODE_ENV: production
      # 数据库类型切换（pglite / postgres），从 .env 读取
      DB_TYPE: ${DB_TYPE:-pglite}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-industrial_maintenance}
      DB_USER: ${DB_USER:-postgres}
      # 无默认弱口令：仅 DB_TYPE=postgres 时使用，务必在 .env 中配置强密码
      DB_PASSWORD: ${DB_PASSWORD:-}
      # 阿里云百炼 (DashScope) 大模型配置，从 .env 读取
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL}
      DASHSCOPE_VISION_MODEL: ${DASHSCOPE_VISION_MODEL}
      # Agnes AI 视频生成配置，从 .env 读取
      AGNES_API_KEY: ${AGNES_API_KEY}
      AGNES_BASE_URL: ${AGNES_BASE_URL:-https://apihub.agnes-ai.cn/v1}
      # 魔珐星云 3D 数字人配置 (运行期注入，严禁打包进前端 bundle)
      XINGYUN_APP_ID: ${XINGYUN_APP_ID}
      XINGYUN_APP_SECRET: ${XINGYUN_APP_SECRET}
      # AI 每日预算闸门：默认开启。2026-10-19 实测演示容器里这两个变量从未注入，
      # isAiBudgetEnabled() 恒 false，「AI 调用走预算」在运行态其实是空话；
      # 上限按「一整天连轴演示也打不满」取 50 万 tokens/日，可在 .env 覆盖。
      AI_BUDGET_ENABLED: ${AI_BUDGET_ENABLED:-true}
      AI_DAILY_BUDGET: ${AI_DAILY_BUDGET:-500000}
    volumes:
      - appdata:/app/data           # PGlite 数据库持久化
      - uploads:/app/public/uploads # 缺陷图片上传持久化
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ---------- PostgreSQL 服务（可选，仅 `--profile postgres` 时启用） ----------
  postgres:
    image: postgres:16-alpine
    container_name: industrial-maintenance-postgres
    restart: unless-stopped
    profiles:
      - postgres
    # 数据库优先保障：CPU≤70%、内存≤4G、禁swap
    cpus: "0.7"
    mem_limit: 4g
    memswap_limit: 4g
    cpu_shares: 1024
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # 无默认弱口令：未在 .env 配置 DB_PASSWORD 时为空值，postgres 官方镜像将拒绝初始化并报错
      # （仅在激活 postgres profile 时才会触发，默认 pglite 模式不受影响）
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-industrial_maintenance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # 仅 postgres profile 启用时才创建该映射
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-industrial_maintenance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- 数据库每日定时备份（凌晨 2 点，保留最近 7 天） ----------
  backup:
    image: alpine:3.20
    container_name: industrial-maintenance-backup
    restart: unless-stopped
    # 备份容器低占用：CPU≤50%、内存≤512M
    cpus: "0.5"
    mem_limit: 512m
    memswap_limit: 512m
    cpu_shares: 256
    depends_on:
      - app
    volumes:
      - appdata:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "echo '0 2 * * * sh /scripts/backup.sh' > /etc/crontabs/root && crond -f -l 8"

volumes:
  appdata:
  uploads:
  postgres_data:
